name: Trace Verify

on:
  push:
    paths:
      - "scripts/build.sh"
      - "scripts/utils.sh"
      # The APKMirror picker has its own test step below, so a change to only the
      # python side of it must still run the suite (the bash mirror has to agree).
      - "scripts/apkmirror_search.py"
      - ".github/traces/**"
  workflow_dispatch:

concurrency:
  group: trace-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run trace harness verify
        run: |
          sudo apt-get update && sudo apt-get install -y jq || true
          bash .github/traces/trace_runner.sh verify

      - name: Run helper regression tests
        run: |
          bash .github/traces/test_patch_versions.sh
          bash .github/traces/test_cache_helpers.sh
          bash .github/traces/test_bundle_helpers.sh
          bash .github/traces/test_apkmirror_variants.sh
