name: Sync upstream

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream/main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Fork-specific files that must never be replaced by upstream.
          PROTECTED=(README.md .github/scripts/generate_release_notes.py .github/workflows/sync-upstream.yml)
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "https://github.com/nullcpy/rvb.git"
          else
            git remote add upstream "https://github.com/nullcpy/rvb.git"
          fi
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already in sync with upstream/main."
            exit 0
          fi
          if ! git merge --no-commit --no-ff upstream/main; then
            echo "Merge produced conflicts; protected paths will keep ours."
          fi
          if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo "::error::Upstream merge did not start; refusing to continue."
            exit 1
          fi
          # Keep fork-specific files exactly as they were before the merge.
          for f in "${PROTECTED[@]}"; do
            if git cat-file -e "HEAD:$f" 2>/dev/null; then
              git checkout HEAD -- "$f" || true
            else
              git rm -q -f -- "$f" || true
            fi
          done
          # Any remaining conflict on a protected path is ours; anything else
          # needs a human, because we never want to guess at upstream code.
          for f in $(git diff --name-only --diff-filter=U || true); do
            case "$f" in
              README.md|.github/scripts/generate_release_notes.py|.github/workflows/sync-upstream.yml)
                if git cat-file -e "HEAD:$f" 2>/dev/null; then
                  git checkout --ours -- "$f"
                else
                  git rm -q -- "$f"
                fi
                ;;
            esac
          done
          if [ -n "$(git diff --name-only --diff-filter=U || true)" ]; then
            echo "Unresolved conflicts outside protected paths:"
            git diff --name-only --diff-filter=U || true
            exit 1
          fi
          git add -A
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to merge after keeping fork files."
            git merge --abort || true
            exit 0
          fi
          git commit -m "Sync upstream/main (keeping fork README and release notes)"
          git push origin HEAD:main
