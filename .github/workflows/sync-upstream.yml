name: Sync upstream

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        branch: [main, update]
    steps:
      - name: Merge upstream into ${{ matrix.branch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/merge-upstream" \
            --method POST \
            -f branch="${{ matrix.branch }}" \
            --jq '{message, merge_type, base_branch}' || echo "Already in sync or nothing to merge for ${{ matrix.branch }}"
